databases:
  - name: campuslink-db
    databaseName: campuslink
    user: campuslink
    plan: basic-256mb
    region: singapore

services:
  - type: web
    name: campuslink
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn campuslink.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.2
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: campuslink-db
          property: connectionString
